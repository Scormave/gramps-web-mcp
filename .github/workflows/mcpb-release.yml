name: MCPB Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-version:
    name: Check release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/check-release-version.sh "$RELEASE_TAG"

  build-mcpb:
    name: Pack MCPB (${{ matrix.rid }})
    needs: release-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # smoke: the runner can start this bundle's binary itself.
        include:
          - rid: osx-arm64
            runner: macos-latest
            smoke: true
          - rid: osx-x64
            runner: macos-latest
          - rid: win-x64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-latest
            smoke: true
          - rid: linux-arm64
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep -o '<Version>[^<]*</Version>' GrampsWeb.Mcp/GrampsWeb.Mcp.csproj | sed 's/<[^>]*>//g' | head -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: dotnet test gramps-web-mcp.sln -c Release

      - name: Install MCPB CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: Pack MCPB bundle
        shell: bash
        run: ./scripts/pack-mcpb.sh "${{ matrix.rid }}" "${{ steps.version.outputs.version }}"

      - name: Smoke-test the bundle
        if: ${{ matrix.smoke }}
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/smoke-test.py mcpb \
            "dist/gramps-web-mcp-claude-desktop-${RID}-v${VERSION}.mcpb" --version "$VERSION"

      - name: Upload MCPB artifact
        uses: actions/upload-artifact@v7
        with:
          name: mcpb-${{ matrix.rid }}
          path: dist/*.mcpb
          if-no-files-found: error

  # A manual run on a branch packs and smoke-tests the bundles, and stops here.
  publish-release:
    name: Publish GitHub Release assets
    needs: build-mcpb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mcpb-*
          merge-multiple: true
          path: dist

      - name: Attach MCPB bundles to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.mcpb
          generate_release_notes: true
