name: CI

# The weekly run catches advisories published for packages we already use,
# when nothing in the repository changes.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore gramps-web-mcp.sln

      - name: Build
        run: dotnet build gramps-web-mcp.sln --no-restore -c Release

      # The integration tests run in their own job; here they would only be
      # skipped and add a second coverage report.
      - name: Test
        run: >
          dotnet test GrampsWeb.Mcp.Tests/GrampsWeb.Mcp.Tests.csproj --no-build -c Release --verbosity normal
          --collect "Code Coverage;Format=cobertura"
          --results-directory "$RUNNER_TEMP/coverage"

      # Line coverage of the server, without the test project, on the job's
      # summary page. Raise the minimum as tests are added.
      - name: Coverage
        run: python3 scripts/coverage-summary.py "$RUNNER_TEMP/coverage" --min-line 75

  # The tools against a real Gramps Web server: the image pinned in
  # GrampsWeb.Mcp.IntegrationTests/grampsweb.Dockerfile, started by
  # Testcontainers on the runner's Docker.
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Pulled in its own step, so the log shows the download apart from the tests.
      - name: Pull Gramps Web image
        run: docker pull "$(sed -n 's/^FROM //p' GrampsWeb.Mcp.IntegrationTests/grampsweb.Dockerfile)"

      - name: Test
        env:
          GRAMPS_INTEGRATION_TESTS: "true"
        run: dotnet test GrampsWeb.Mcp.IntegrationTests/GrampsWeb.Mcp.IntegrationTests.csproj -c Release --verbosity normal

  vulnerable-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore gramps-web-mcp.sln

      # GitHub's dependency graph lists only the packages named in the .csproj
      # files, so Dependabot alerts miss transitive ones; this check covers them.
      # dotnet list exits 0 when it finds vulnerable packages and 1 when it
      # cannot check, so the step reads the JSON report for findings.
      - name: Check for vulnerable packages
        run: |
          dotnet list gramps-web-mcp.sln package --vulnerable --include-transitive --format json > "$RUNNER_TEMP/vulnerable.json"
          found=$(jq -r '
            .projects[]
            | (.path | split("/") | last) as $project
            | .frameworks[]?
            | ((.topLevelPackages // []) + (.transitivePackages // []))[]
            | select(.vulnerabilities)
            | "\($project): \(.id) \(.resolvedVersion), \(.vulnerabilities | map("\(.severity) \(.advisoryurl)") | join(", "))"
          ' "$RUNNER_TEMP/vulnerable.json")
          if [ -n "$found" ]; then
            echo "$found" | sed 's/^/::error::/'
            exit 1
          fi
          echo "No known vulnerable packages, transitive ones included."
