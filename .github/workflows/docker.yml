name: Build and push container image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

# Each job gets only what it needs: only the image job can write packages and
# attestations, and only it and the registry job can request an OIDC token, to
# sign the attestation and to log in to the MCP Registry. Checkout keeps no
# token, so the tests, the smoke test and mcp-publisher cannot read one from
# .git/config.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/check-release-version.sh "$RELEASE_TAG"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore gramps-web-mcp.sln

      - name: Build
        run: dotnet build gramps-web-mcp.sln --no-restore -c Release

      - name: Test
        run: dotnet test gramps-web-mcp.sln --no-build -c Release --verbosity normal

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The smoke test runs the amd64 image before anything is pushed; the
      # multi-platform build below takes its amd64 layers from the cache.
      - name: Build the image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: gramps-web-mcp:smoke

      - name: Smoke-test the image
        run: python3 scripts/smoke-test.py image gramps-web-mcp:smoke

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: |
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${REPO_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The attestation covers the multi-platform index by digest, so it holds
      # for every tag of this push. GitHub keeps it, and `gh attestation
      # verify` reads it from there. No copy goes to GHCR: without the OCI
      # referrers API it would add a `sha256-<digest>` tag for every push.
      # Storage records exist only for organization repositories.
      - name: Attest the image
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
          create-storage-record: false

  mcp-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Set release version in server.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/scormave/gramps-web-mcp:${VERSION}"
          jq --arg version "$VERSION" --arg image "$IMAGE" \
            '.version = $version | .packages |= map(if .registryType == "oci" then .identifier = $image else . end)' \
            server.json > server.tmp
          mv server.tmp server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
